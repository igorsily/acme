name: acme-infra

services:
  postgis:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acme}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGIS_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  watchtower:
    image: containrrr/watchtower:1.7.1
    profiles:
      - updates
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.40}
    command:
      - --cleanup
      - --label-enable
      - --rolling-restart
      - --interval
      - "${WATCHTOWER_POLL_INTERVAL:-86400}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - private

networks:
  public:
    name: acme-public
    driver: bridge
  private:
    name: acme-private
    driver: bridge

volumes:
  postgis_data:
  redis_data:
